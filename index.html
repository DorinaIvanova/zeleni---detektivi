function getTask(a){return a.position<2?TASKS[a.mission].practice[a.position]:TASKS[a.mission].check[a.position-2];}
function attempt(){return session.attempts.find(a=>a.id===view.id);}
function draft(){return {value:'',sign:'',segments:0,hintUsed:false,firstAnswer:null,wrongChecks:0,checks:0,startedAt:now(),locked:false,feedback:null};}
function taskLabel(t){return t.kind==='compare'?`${t.left} ${t.lu} ○ ${t.right} ${t.ru}`:`${t.from} ${t.uf} = … ${t.ut}`;}
function answerLabel(t,a){if(!a)return 'Няма отговор';return t.kind==='compare'?`${a.value} ${t.ut}; знак ${a.sign||'—'}`:`${a.value} ${t.ut}${a.segments!==undefined?' · '+a.segments+' секции':''}`;}
function correctLabel(t){return t.kind==='compare'?`${t.converted} ${t.ut}; знак ${t.sign}`:`${t.answer} ${t.ut}`;}
function getStats(a){const p=a.results.filter(r=>r.phase==='practice'),q=a.results.filter(r=>r.phase==='check');return {first:p.filter(r=>r.firstCorrect).length,practice:p.length,quiz:q.filter(r=>r.correct).length,answered:q.length,hints:p.filter(r=>r.hintUsed).length,wrong:p.reduce((n,r)=>n+r.wrongChecks,0)};}
function isCorrect(t,ans){return Number.isInteger(ans.value)&&(t.kind==='compare'?ans.value===t.converted&&ans.sign===t.sign:ans.value===t.answer&&(t.model!=='build'||ans.segments===t.answer));}
function errorsFor(t,ans){const e=[];if(ans.value!==(t.kind==='compare'?t.converted:t.answer))e.push('Превръщане');if(t.kind==='compare'&&ans.sign!==t.sign)e.push('Сравняване');if(t.model==='build'&&ans.segments!==t.answer)e.push('Построяване на модела');return e;}
function completed(){return session.attempts.filter(a=>a.completedAt);}
function launch(mission,replay=false){if(!TASKS[mission])return;let a=[...session.attempts].reverse().find(a=>a.mission===mission);if(!a||replay){a={id:uid(),mission,startedAt:now(),position:0,results:[],draft:draft(),completedAt:null};session.attempts.push(a);persistSession();}view={name:a.completedAt?'result':'play',id:a.id};render();window.scrollTo(0,0);}
function goHome(){view={name:'home'};render();window.scrollTo(0,0);}

function motionAllowed(){return !window.matchMedia?.('(prefers-reduced-motion: reduce)')?.matches;}
function currentMotion(a){return a.position<2&&motionAllowed()&&visualFrame?.attemptId===a.id&&visualFrame?.taskId===getTask(a)?.id?visualFrame:null;}
function buildSound(){
if(!sound)return;
try{
 audioContext ||= new (window.AudioContext||window.webkitAudioContext)();audioContext.resume();
 const clock=audioContext.currentTime,osc=audioContext.createOscillator(),gain=audioContext.createGain();
 osc.type='triangle';osc.frequency.setValueAtTime(650,clock);osc.frequency.exponentialRampToValueAtTime(180,clock+.07);
 gain.gain.setValueAtTime(.0001,clock);gain.gain.exponentialRampToValueAtTime(.055,clock+.008);gain.gain.exponentialRampToValueAtTime(.0001,clock+.09);
 osc.connect(gain);gain.connect(audioContext.destination);osc.start(clock);osc.stop(clock+.1);
}catch(e){}
}

function guideHTML(a){
if(a.position>=2)return '';
const d=a.draft,m=TASKS[a.mission],moving=currentMotion(a);
const mood=d.feedback?.type==='good'?'happy':d.feedback?.type==='bad'?'thinking':(moving||d.hintUsed)?'inspect':'ready';
const message=mood==='happy'?'Откритие! Измерването е вярно.':mood==='thinking'?'Да проверим следата още веднъж.':mood==='inspect'?'Огледай внимателно своя модел.':m.intro;
return `<div class="scene-title detective-guide"><div class="guide-character">${detectiveSVG(mood)}</div><div class="guide-bubble"><span class="guide-label">Твоят зелен детектив</span><p>${esc(message)}</p></div></div>`;
}

function sceneBackdrop(key,width,height){
const image=missionArt(key).match(/src="([^"]+)"/)?.[1]||'';
return `<image href="${image}" x="0" y="0" width="${width}" height="${height}" preserveAspectRatio="xMidYMid slice" opacity=".43"/><rect width="${width}" height="${height}" fill="#edf3d2" opacity=".37"/>`;
}

function rulerSVG(count,unit='см',max=10,motion=null){
let marks='',blocks='';
for(let i=0;i<max;i++){
 blocks+=`<rect x="${34+i*44}" y="137" width="44" height="66" fill="#fff9df"/>`;
 for(let j=1;j<10;j++)marks+=`<path d="M${34+i*44+j*4.4} 137v${j===5?18:10}" stroke="#7d855b"/>`;
}
for(let i=0;i<=max;i++)marks+=`<path d="M${34+i*44} 137v30" stroke="#50643e" stroke-width="1.7"/><text x="${34+i*44}" y="189" text-anchor="middle" fill="#334f35" font-size="15" font-weight="600" font-family="sans-serif">${i*10}</text>`;
const from=Math.max(0,Math.min(max,motion?.before??count));

function bridgeNumber(value){const raw=String(value).trim();return /^\d+$/.test(raw)&&Number.isSafeInteger(Number(raw))?Number(raw):null;}
function bridgeGiven(t,side){return side==='left'?t.left:t.right;}
function bridgeReady(t,d){
const state=d.bridges||{},converted=bridgeNumber(d.value),other=t.convertSide==='left'?'right':'left';
return converted!==null&&state.left!=null&&state.right!=null&&state[t.convertSide].value===converted&&state[other].value===bridgeGiven(t,other);
}
function answerBridges(t,value){
const given=t.convertSide==='left'?'right':'left';
return {[t.convertSide]:{value:bridgeNumber(value)??0,unit:t.ut},[given]:{value:bridgeGiven(t,given),unit:t.ut}};
}
function bridgeControls(t,d){
return `<div class="bridge-workshop"><p>Построй всеки мост с отделно натискане.</p><div class="bridge-build-buttons">${['left','right'].map(side=>{
 const item=d.bridges?.[side],isConverted=side===t.convertSide,isBuilt=!!item&&(!isConverted||item.value===bridgeNumber(d.value));
 return `<button type="button" class="btn ${isBuilt?'soft':'white'}" data-action="build-bridge" data-side="${side}" ${d.locked||isBuilt?'disabled':''}>${isBuilt?'✓ ':''}Построй мост ${side==='left'?'А':'Б'}</button>`;
}).join('')}</div><div class="bridge-build-status" aria-live="polite">${bridgeReady(t,d)?'Двата моста са построени. Сега ги сравни.':'Въведи превръщането и построй двата моста.'}</div></div>`;
}
function buildBridge(side){
const a=attempt(),t=a&&getTask(a);if(!a||a.position>=2||t.kind!=='compare'||a.draft.locked||!['left','right'].includes(side))return;
const d=a.draft,isConverted=side===t.convertSide,value=isConverted?bridgeNumber(d.value):bridgeGiven(t,side);
if(value===null){setFeedback('neutral','Първо запиши превръщането с цяло неотрицателно число.');$('answer')?.focus();return;}
d.bridges ||= {};
if(d.bridges[side]?.value===value)return;
const previous=d.bridges[side]?.value??0;
d.bridges[side]={value,unit:t.ut};d.bridgeBuilds ||= [];
d.bridgeBuilds.push({side,value,unit:t.ut,at:now()});d.sign='';d.feedback=null;
visualFrame={attemptId:a.id,taskId:t.id,kind:'bridge',side,before:previous,after:value};
buildSound();persistSession();render();
}

function homeHTML(){return `<section class="hero"><div><div class="eyebrow">Малко приключение. Големи открития.</div><h1>Всяка следа<br><span>има своя мярка.</span></h1><p class="intro">Избери мисия. Построй, провери и открий изгубените измервания в нашата гора.</p><div class="tags"><span class="tag">2 задачи за упражнение</span><span class="tag">3 задачи за самостоятелна работа</span></div></div><div class="hero-art">${leafArt()}</div></section><section class="missions" aria-label="Избор на мисия">${Object.entries(TASKS).map(([key,m],i)=>{const a=[...session.attempts].reverse().find(a=>a.mission===key);return `<article class="card mission" data-kind="${key}"><div class="mission-thumb">${missionArt(key)}</div><span class="mission-number">МИСИЯ 0${i+1}</span><div class="mission-icon" aria-hidden="true">${m.icon}</div><h3>${m.title}</h3><p>${m.skill}${a?`<br><span class="badge">${a.completedAt?'Завършена · '+getStats(a).quiz+' от 3': 'Започната · продължи'}</span>`:''}</p><button class="btn" type="button" data-action="launch" data-mission="${key}">${a?(a.completedAt?'Виж резултата':'Продължи мисията'):'Започни мисията'} <span aria-hidden="true">→</span></button></article>`;}).join('')}</section>${completed().length?`<section class="save-strip"><div><strong>Браво за положеното усилие!</strong><p class="small muted">Можеш да запазиш резултата или да избереш друга мисия.</p></div><button class="btn" data-action="save-page">Приключи и запази</button></section>`:''}`;}
function playHTML(a){const m=TASKS[a.mission],t=getTask(a),d=a.draft,isQuiz=a.position>=2,n=isQuiz?a.position-1:a.position+1,success=d.locked&&d.feedback?.type==='good',motion=currentMotion(a),canCompare=isQuiz||t.kind!=='compare'||bridgeReady(t,d);let scene='';if(isQuiz){scene=`<div class="scene-title">Самостоятелно откритие</div><div style="padding:35px 24px;text-align:center;display:grid;place-items:center;min-height:230px"><div><div class="check-illustration">${missionArt(a.mission)}</div><h3>Сега опитай самостоятелно.</h3><p class="muted small" style="margin-top:14px">Предай своя отговор.<br>Ще видиш решенията накрая.</p></div></div><div class="scene-note">Задача ${n} от 3 · без подсказки</div>`;}else{scene=`${guideHTML(a)}<div id="model">${a.mission==='leaves'?rulerSVG(t.model==='given'?t.given:d.segments,'см',10,motion):a.mission==='ladder'?ladderSVG(t.model==='given'?t.given:d.segments,success,t.model==='given'?t.given:t.answer,motion):bridgeSVG(t,success,d.bridges||(d.locked?answerBridges(t,d.value):{}),motion)}</div>${t.kind==='compare'?bridgeControls(t,d):''}${t.model==='build'?`<div class="build-controls"><button class="btn white" data-action="subtract" ${d.locked||d.segments===0?'disabled':''}>− ${a.mission==='leaves'?'Премахни 1 дм':'Премахни 1 м'}</button><button class="btn soft" data-action="add" ${d.locked||d.segments>=10?'disabled':''}>+ ${a.mission==='leaves'?'Добави 1 дм':'Добави 1 м'}</button></div>`:''}<div class="scene-note">${a.mission==='leaves'?'Учебен модел · всеки голям участък е 10 см.':a.mission==='ladder'?'Учебен модел · всяка секция е дълга 1 м.':'Първо запиши в еднакви единици. После сравни.'}</div>`;}
if(isQuiz&&t.kind==='compare'&&d.locked){scene=`<div class="scene-title">Модел на твоя предаден отговор</div><div id="model">${bridgeSVG(t,false,answerBridges(t,d.value),null,true)}</div><div class="scene-note">Отговорът е записан. Верните решения ще видиш накрая.</div>`;}
const from=t.kind==='compare'?(t.convertSide==='left'?t.left:t.right):t.from,uf=t.kind==='compare'?(t.convertSide==='left'?t.lu:t.ru):t.uf;
const question=t.kind==='compare'?`Коя дължина е по-голяма?<br><span style="white-space:nowrap">${t.left} ${t.lu} <span aria-hidden="true">○</span> ${t.right} ${t.ru}</span>`:(t.text||'Попълни липсващото число.');

function flattened(list=cloud.rows){return list.flatMap(r=>r.attempts.map(a=>({record:r,attempt:a,stats:getStats(a)})));}
function filteredRows(){const query=filterCode.trim().toLocaleUpperCase('bg-BG');return flattened().filter(x=>!query||x.record.code.includes(query));}
function teacherTable(){const rows=filteredRows();return rows.length?`<div class="table-scroll"><table><thead><tr><th>Код / дата</th><th>Мисия</th><th>Статус</th><th>Първи опит<br>тренировка</th><th>Самостоятелно</th><th>Помощ</th><th>Грешни проверки</th></tr></thead><tbody>${rows.map(x=>`<tr><td><strong>${esc(x.record.code)}</strong><br>${esc(new Date(x.record.savedAt).toLocaleString('bg-BG'))}</td><td>${TASKS[x.attempt.mission].title}<br><span class="muted">Опит ${attemptNumber(x.record,x.attempt)}</span></td><td>${x.attempt.completedAt?'Завършена':'Незавършена'}</td><td>${x.stats.first} от ${x.stats.practice}</td><td>${x.stats.quiz} от ${x.stats.answered}${x.stats.answered<3?'<br><span class="muted">отговорени '+x.stats.answered+' от 3</span>':''}</td><td>${x.stats.hints}</td><td>${x.stats.wrong}</td></tr>`).join('')}</tbody></table></div>`:`<div class="empty">${cloud.rows.length?'Няма резултат за този код.':'Все още няма запазени резултати. Завършете мисия и натиснете „Приключи и запази“.'}</div>`;}

function setFeedback(type,text){const a=attempt();a.draft.feedback={type,text};persistSession();render();}
function submit(){const a=attempt();if(!a||a.draft.locked)return;const d=a.draft,t=getTask(a);const raw=d.value.trim();if(!/^\d+$/.test(raw)||!Number.isSafeInteger(Number(raw))){setFeedback('neutral','Запиши цяло неотрицателно число.');$('answer')?.focus();return;}if(t.kind==='compare'&&a.position<2&&!bridgeReady(t,d)){setFeedback('neutral','Построй и двата моста с отделните бутони.');return;}if(t.kind==='compare'&&!['<','>','='].includes(d.sign)){setFeedback('neutral','Избери и знак за сравняване.');return;}const ans={value:Number(raw),...(t.kind==='compare'?{sign:d.sign}:{}),...(t.model==='build'?{segments:d.segments}:{})};if(!d.firstAnswer)d.firstAnswer={...ans};d.checks++;const good=isCorrect(t,ans),isQuiz=a.position>=2;if(!good)d.wrongChecks++;
if(isQuiz||good){d.locked=true;const r={taskId:t.id,phase:isQuiz?'check':'practice',firstAnswer:d.firstAnswer,finalAnswer:ans,firstCorrect:isCorrect(t,d.firstAnswer),correct:good,firstErrors:errorsFor(t,d.firstAnswer),hintUsed:!isQuiz&&d.hintUsed,wrongChecks:d.wrongChecks,checks:d.checks,seconds:Math.max(0,Math.round((Date.now()-new Date(d.startedAt).getTime())/1000)),submittedAt:now(),...(t.kind==='compare'&&!isQuiz?{bridgeBuilds:(d.bridgeBuilds||[]).map(x=>({...x}))}:{})};a.results.push(r);d.feedback={type:isQuiz?'neutral':'good',text:isQuiz?'Отговорът ти е записан. Продължи към следващата стъпка.':'Точно така! Измерването е вярно.'};if(!isQuiz)beep(true);
}else{const es=errorsFor(t,ans);d.feedback={type:'bad',text:es.includes('Превръщане')?'Опитай пак. Провери колко малки единици има в една голяма.':es.includes('Построяване на модела')?'Провери дали построената дължина отговаря на задачата.':'Провери знака. Сравни числата в еднакви единици.'};beep(false);}persistSession();render();}
function next(){const a=attempt();if(!a?.draft.locked)return;if(a.position===4){a.completedAt=now();view={name:'result',id:a.id};}else{a.position++;a.draft=draft();}persistSession();render();window.scrollTo(0,0);}

function cloudError(e){
 const msg=String(e?.message||'');
 if(e?.name==='AbortError'||e?.offline||e instanceof TypeError)return 'Няма връзка с общата база. Резултатът остава за повторно изпращане.';
 if(/anonymous.*disabled|anonymous_provider_disabled/i.test(msg))return 'В Supabase трябва да се включи Anonymous Sign-Ins.';
 if(/PGRST202|PGRST205|green_submit_result.*not|green_results.*not|green_teachers.*not/i.test(msg))return 'Първо изпълнете SQL файла за базата в Supabase → SQL Editor.';
 if(/email.*not.*confirmed/i.test(msg))return 'Имейлът на учителския профил не е потвърден. Проверете Authentication → Users.';
 if(/invalid.login.credentials|invalid_credentials/i.test(msg))return 'Имейлът или паролата не са верни.';
 if(e?.status===429)return 'Има твърде много заявки. Опитайте отново след малко.';
 if(e?.status===401)return 'Сесията е изтекла. Опитайте отново или влезте отново като учител.';
 if(e?.status===403||e?.code==='42501')return 'Липсват нужните права за тази операция. Проверете SQL настройката и учителската роля.';
 return msg||'Операцията не успя. Опитайте отново.';
}
async function supaRequest(path,options={}){
 if(globalThis.navigator?.onLine===false){const e=new Error('offline');e.offline=true;throw e;}
 const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),12000);
 try{
  const headers={apikey:CLOUD_CONFIG.key,...options.headers};
  if(options.token)headers.Authorization='Bearer '+options.token;
  if(options.data!==undefined)headers['Content-Type']='application/json';
  const response=await fetch(CLOUD_CONFIG.url+path,{method:options.method||'GET',headers,body:options.data===undefined?undefined:JSON.stringify(options.data),signal:controller.signal,cache:'no-store'});
  const raw=await response.text();let data=null;try{data=raw?JSON.parse(raw):null;}catch(e){if(response.ok)throw new Error('Базата върна неразпознат отговор.');}
  if(!response.ok){const e=new Error(data?.message||data?.error_description||data?.msg||data?.error||'Грешка при връзката с базата.');e.status=response.status;e.code=data?.code||data?.error_code;throw e;}
  return options.metadata?{data,range:response.headers.get('content-range')}:data;
 }finally{clearTimeout(timer);}
}
function rememberAuth(kind,data){

 const auth={access_token:data.access_token,refresh_token:data.refresh_token,user:data.user,expires_at:data.expires_at||Math.floor(Date.now()/1000)+(data.expires_in||3600)};
 cloud[kind]=auth;cloudStored(kind==='teacher'?CLOUD_TEACHER_KEY:CLOUD_STUDENT_KEY,auth,kind==='teacher');return auth;
}
function clearTeacher(){cloud.generation++;cloud.teacher=null;cloud.verified=false;cloud.rows=[];cloud.invalidRows=0;cloud.updatedAt=null;cloud.resetMessage='';cloudStored(CLOUD_TEACHER_KEY,null,true);}
async function accessFor(kind,force=false){
 let auth=cloud[kind];
 if(auth&&!force&&auth.expires_at>Math.floor(Date.now()/1000)+60)return auth;
 if(auth?.refresh_token){
  try{return rememberAuth(kind,await supaRequest('/auth/v1/token?grant_type=refresh_token',{method:'POST',data:{refresh_token:auth.refresh_token}}));}
  catch(e){if(![400,401,403].includes(e.status))throw e;cloud[kind]=null;if(kind==='teacher'){clearTeacher();throw e;}}
 }
 if(kind==='teacher')throw new Error('Влезте с учителския си профил.');
 return rememberAuth('student',await supaRequest('/auth/v1/signup',{method:'POST',data:{data:{app:'green-detectives'}}}));
}
async function authRequest(kind,path,options={}){
 let auth=await accessFor(kind);
 try{return await supaRequest(path,{...options,token:auth.access_token});}
 catch(e){if(e.status!==401)throw e;auth=await accessFor(kind,true);return supaRequest(path,{...options,token:auth.access_token});}
}

async function syncPending(){
 if(cloud.syncPromise)return cloud.syncPromise;
 cloud.syncing=true;cloud.syncError='';cloudNotice();
 const task=(async()=>{
  try{
   const tried=new Set();
   for(;;){
    const record=pendingCloudRecords().find(r=>!tried.has(r.id));if(!record)break;tried.add(record.id);
    try{
     const ack=await authRequest('student','/rest/v1/rpc/green_submit_result',{method:'POST',data:{p_record:record}});
     if(!ack||ack.id!==record.id||!ack.created_at)throw new Error('Няма потвърждение за запис на този резултат.');
     cloud.queue[record.id]={status:'synced',created_at:ack.created_at};
    }catch(e){
     if(e.status===410||e.code==='PT410')cloud.queue[record.id]={status:'cleared'};
     else throw e;
    }
    cloudStored(CLOUD_QUEUE_KEY,cloud.queue);
   }
  }catch(e){cloud.syncError=cloudError(e);}
 })();
 cloud.syncPromise=task.finally(()=>{cloud.syncing=false;cloud.syncPromise=null;cloudNotice();});
 return cloud.syncPromise;
}

function normaliseCloudRecord(row){
 try{
  const p=row.payload;if(!p||typeof p!=='object'||p.id!==row.id||typeof p.code!=='string'||!/^[А-ЯA-Z]{2}-[1-9][0-9]?$/.test(p.code)||!Array.isArray(p.attempts)||!p.attempts.length) return null;
  const attempts=p.attempts.map(a=>{
   if(!a||typeof a.id!=='string'||!TASKS[a.mission]||!Array.isArray(a.results))throw new Error('Invalid attempt');
   const m=TASKS[a.mission],seen=new Set();
   const results=a.results.map(r=>{
    const t=[...m.practice,...m.check].find(t=>t.id===r.taskId);if(!t||seen.has(r.taskId))throw new Error('Invalid task');seen.add(r.taskId);
    if(!r.firstAnswer||!r.finalAnswer||![r.firstAnswer.value,r.finalAnswer.value].every(v=>Number.isSafeInteger(v)&&v>=0))throw new Error('Invalid answer');
    const phase=m.practice.some(t=>t.id===r.taskId)?'practice':'check';
    const num=(v,defaultValue=0)=>Number.isSafeInteger(v)&&v>=0?v:defaultValue;
    return {...r,phase,firstCorrect:isCorrect(t,r.firstAnswer),correct:isCorrect(t,r.finalAnswer),firstErrors:errorsFor(t,r.firstAnswer),hintUsed:phase==='practice'&&r.hintUsed===true,wrongChecks:num(r.wrongChecks),checks:num(r.checks,1),seconds:num(r.seconds),bridgeBuilds:(Array.isArray(r.bridgeBuilds)?r.bridgeBuilds:[]).filter(b=>b&&['left','right'].includes(b.side)&&Number.isSafeInteger(b.value)&&b.value>=0&&['см','дм','м'].includes(b.unit))};
   });
   return {...a,results,completedAt:results.filter(r=>r.phase==='check').length===3&&a.completedAt?a.completedAt:null};
  });
  return {...p,savedAt:row.created_at,attempts};
 }catch(e){return null;}
}

async function loadTeacherRows(){
 const generation=cloud.generation;let offset=0,items=[],invalid=0;
 for(;;){
  const result=await authRequest('teacher','/rest/v1/green_results?select=id,created_at,payload&order=created_at.asc,id.asc&limit=200&offset='+offset,{headers:{Prefer:'count=exact'},metadata:true});
  if(generation!==cloud.generation)return;
  if(!Array.isArray(result.data))throw new Error('Неуспешно зареждане на общите резултати.');
  for(const row of result.data){const normal=normaliseCloudRecord(row);if(normal)items.push(normal);else invalid++;}
  offset+=result.data.length;const match=result.range?.match(/\/(\d+)$/),total=match?Number(match[1]):null;
  if(!result.data.length||(total!==null?offset>=total:result.data.length<200))break;
 }
 if(generation!==cloud.generation)return;
 cloud.rows=items;cloud.invalidRows=invalid;cloud.updatedAt=now();
}

async function resetTeacherResults(){
 if(!cloud.verified||cloud.loading||cloud.resetting)return;
 if(!window.confirm('Да се изтрият всички вече записани резултати от общата база? Действието не може да се отмени.'))return;
 cloud.resetting=true;cloud.loading=true;cloud.error='';cloud.resetMessage='';render();
 let resetConfirmed=false;
 try{
  await verifyTeacher();const generation=cloud.generation,oldIDs=new Set(cloud.rows.map(r=>r.id));
  const ack=await authRequest('teacher','/rest/v1/rpc/green_reset_results',{method:'POST',data:{}});
  if(generation!==cloud.generation)return;
  if(!ack||!Number.isSafeInteger(ack.deleted)||ack.deleted<0||!ack.reset_at)throw new Error('Не получих потвърждение за нулирането. Натисни „Покажи новите резултати“, за да провериш състоянието.');
  resetConfirmed=true;
  for(const id of oldIDs)if(cloud.queue[id])cloud.queue[id]={status:'cleared'};
  cloudStored(CLOUD_QUEUE_KEY,cloud.queue);filterCode='';cloud.rows=[];cloud.invalidRows=0;cloud.updatedAt=ack.reset_at;

 }catch(e){
  if(resetConfirmed)cloud.error='Нулирането е потвърдено, но последващото зареждане не успя. Натисни „Покажи новите резултати“.';
  else if(e.name==='AbortError'||e.offline||e instanceof TypeError)cloud.error='Няма потвърждение за нулирането. Натисни „Покажи новите резултати“, за да провериш състоянието.';
  else if(e.status===404||/PGRST202|green_reset_results/i.test(String(e.message)))cloud.error='Първо изпълни SQL кода за нулирането в Supabase → SQL Editor.';

function teacherLoginHTML(){return `<section class="save-box card"><span class="badge">Общи резултати</span><h2>Вход за учителя</h2><p class="muted">Влез с профила, създаден в Supabase → Authentication → Users.</p>${cloud.loading?'<div class="notice" role="status">Проверяваме достъпа…</div>':''}${cloud.error?`<div class="notice" role="alert">${esc(cloud.error)}</div>`:''}<form id="teacher-login-form"><label class="cloud-field-label" for="teacher-email">Имейл</label><input class="code cloud-login-input" type="email" id="teacher-email" name="email" autocomplete="username" required ${cloud.loading?'disabled':''}><label class="cloud-field-label" for="teacher-password">Парола</label><input class="code cloud-login-input" type="password" id="teacher-password" name="password" autocomplete="current-password" required ${cloud.loading?'disabled':''}><div class="actions"><button class="btn" type="submit" ${cloud.loading?'disabled':''}>${cloud.loading?'Влизане…':'Вход'}</button><button class="btn white" type="button" data-action="home">Към играта</button></div></form><p class="small muted" style="margin-top:18px">Учениците играят без имейл и парола. Този вход е за преглед на резултатите от всички устройства.</p></section>`;}



async function finish(code){
if(cloud.savingID||!completed().length)return;
const normalized=code.trim().toLocaleUpperCase('bg-BG');
if(!/^[А-ЯA-Z]{2}-[1-9][0-9]?$/.test(normalized)){$('save-feedback').textContent='Напиши две букви, тире и номер от 1 до 99. Например ИП-12.';return;}
let record=records.find(r=>r.id===session.id);
if(!record){record=JSON.parse(JSON.stringify({version:VERSION,id:session.id,code:normalized,startedAt:session.startedAt,savedAt:now(),attempts:session.attempts}));records.push(record);}
let saved=false;try{localStorage.setItem(RECORDS_KEY,JSON.stringify(records));saved=true;}catch(e){storageError='Локалният запис не успя. Оставете страницата отворена до потвърждение от общата база или изтеглете Excel отчет.';}
if(!cloudSaved(record)&&!cloudRecordCleared(record))cloud.queue[record.id]={status:'pending'};
cloudStored(CLOUD_QUEUE_KEY,cloud.queue);cloud.savingID=record.id;
view={name:'saved',record,saved};render();window.scrollTo(0,0);
try{await syncPending();}finally{cloud.savingID=null;if(view.name==='saved'&&view.record?.id===record.id)render();}
}

function attemptNumber(record,a){const pool=cloud.rows.some(r=>r.id===record.id)?cloud.rows:records;const earlier=pool.filter(r=>r.code===record.code).flatMap(r=>r.attempts).filter(x=>x.mission===a.mission);return Math.max(1,earlier.findIndex(x=>x.id===a.id)+1);}
function printCertificate(){if(view.name!=='saved')return;const r=view.record;const names=r.attempts.filter(a=>a.completedAt).map(a=>TASKS[a.mission].badge);$('certificate').innerHTML=`<div class="cert-leaves">❧ 🌿 ❧</div><p>STEM ПРОЕКТ „ЗЕЛЕНИ ДЕТЕКТИВИ“</p><h1>ГРАМОТА<br>ЗА ДЕТЕКТИВСКО РАЗСЛЕДВАНЕ</h1><p>Връчва се на детектив с код:</p><div class="print-code">${esc(r.code)}</div><p>За участие и старание в приключението<br>„Мистерията на изгубените измервания“.</p><p>Ти изследва, провери и направи своите открития!</p><p>${[...new Set(names)].map(esc).join(' · ')}</p><p class="cert-date">Дата: ${esc(new Date(r.savedAt).toLocaleDateString('bg-BG'))}</p>`;window.print();}
function download(blob,name){const a=document.createElement('a'),url=URL.createObjectURL(blob);a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),5000);}
function reportSheets(list){const summary=[['ЗЕЛЕНИ ДЕТЕКТИВИ — ОБОБЩЕНИ РЕЗУЛТАТИ'],['Код','Дата','Мисия','Опит','Статус','Тренировка: верни от първия опит','Тренировка: отговорени','Самостоятелно: верни','Самостоятелно: отговорени','Самостоятелно: дял верни','Подсказки','Грешни тренировъчни проверки']];const details=[['ЗЕЛЕНИ ДЕТЕКТИВИ — ПОДРОБНИ РЕЗУЛТАТИ'],['Код','Дата','Мисия','Опит','Компетентност','Задача','Режим','Първи отговор','Краен отговор','Верен отговор','Вярно от първия опит','Краен резултат','Подсказка','Грешни проверки','Време (секунди, включва паузи)','Затруднения при първи отговор','Построяване на мостовете']];for(const r of list){for(const [key,m]of Object.entries(TASKS)){const aa=r.attempts.filter(a=>a.mission===key);if(!aa.length)summary.push([r.code,r.savedAt,m.title,'','Не е играна','','','','','','','']);for(const a of aa){const s=getStats(a);summary.push([r.code,r.savedAt,m.title,attemptNumber(r,a),a.completedAt?'Завършена':'Незавършена',s.first,s.practice,s.quiz,s.answered,s.answered?s.quiz/s.answered:'',s.hints,s.wrong]);for(const q of a.results){const t=[...m.practice,...m.check].find(t=>t.id===q.taskId);details.push([r.code,r.savedAt,m.title,attemptNumber(r,a),m.skill,taskLabel(t),q.phase==='check'?'Самостоятелно':'Тренировка',answerLabel(t,q.firstAnswer),answerLabel(t,q.finalAnswer),correctLabel(t),q.firstCorrect?'Да':'Не',q.correct?'Вярно':'Невярно',q.hintUsed?'Да':'Не',q.wrongChecks,q.seconds,(q.firstErrors||[]).join('; '),(q.bridgeBuilds||[]).map(b=>(b.side==='left'?'А':'Б')+': '+b.value+' '+b.unit).join('; ')]);}}}}
const analysis=[['ЗЕЛЕНИ ДЕТЕКТИВИ — АНАЛИЗ НА КЛАСА'],['Мисия / компетентност','Завършени опити','Верни самостоятелни отговори','Общо самостоятелни задачи','Дял верни','Подсказки','Грешни тренировъчни проверки','Грешки в превръщането — самостоятелно','Грешки в сравнението — самостоятелно']];for(const [key,m]of Object.entries(TASKS)){const aa=list.flatMap(r=>r.attempts).filter(a=>a.mission===key),done=aa.filter(a=>a.completedAt),ss=done.map(getStats),correct=ss.reduce((n,s)=>n+s.quiz,0),total=done.length*3,checks=done.flatMap(a=>a.results.filter(q=>q.phase==='check'));analysis.push([m.skill,done.length,correct,total,total?correct/total:'',aa.reduce((n,a)=>n+getStats(a).hints,0),aa.reduce((n,a)=>n+getStats(a).wrong,0),checks.filter(q=>q.firstErrors.includes('Превръщане')).length,checks.filter(q=>q.firstErrors.includes('Сравняване')).length]);}analysis.push([],['Повторните опити със същите задачи са включени. Анализирайте първите участия отделно.'],['Три задачи са ориентир; не доказват трайно преодоляване на затруднението.'],['Непроведените мисии не се оценяват с нула. Времето включва паузи.']);return [{name:'Обобщени резултати',rows:summary,percents:[9]},{name:'Подробни резултати',rows:details,percents:[]},{name:'Анализ на класа',rows:analysis,percents:[4]}];}
// Минимален OOXML XLSX генератор: ZIP без компресия; без CDN и без интернет.
const xml=s=>String(s??'').replace(/[\x00-\x08\x0b\x0c\x0e-\x1f]/g,'').replace(/[<>&"']/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;',"'":'&apos;'}[c]));
function colName(n){let s='';for(n++;n;n=Math.floor((n-1)/26))s=String.fromCharCode(65+(n-1)%26)+s;return s;}
const crcTable=Array.from({length:256},(_,i)=>{for(let k=0;k<8;k++)i=i&1?0xedb88320^(i>>>1):i>>>1;return i>>>0;});
function crc32(bytes){let c=0xffffffff;for(const b of bytes)c=crcTable[(c^b)&255]^(c>>>8);return(c^0xffffffff)>>>0;}
function zip(files){const enc=new TextEncoder(),parts=[],central=[];let offset=0,centralSize=0;for(const [name,text]of files){const n=enc.encode(name),data=enc.encode(text),crc=crc32(data);const local=new Uint8Array(30+n.length),v=new DataView(local.buffer);v.setUint32(0,0x04034b50,true);v.setUint16(4,20,true);v.setUint16(6,0x800,true);v.setUint16(12,0x21,true);v.setUint32(14,crc,true);v.setUint32(18,data.length,true);v.setUint32(22,data.length,true);v.setUint16(26,n.length,true);local.set(n,30);parts.push(local,data);const c=new Uint8Array(46+n.length),cv=new DataView(c.buffer);cv.setUint32(0,0x02014b50,true);cv.setUint16(4,20,true);cv.setUint16(6,20,true);cv.setUint16(8,0x800,true);cv.setUint16(14,0x21,true);cv.setUint32(16,crc,true);cv.setUint32(20,data.length,true);cv.setUint32(24,data.length,true);cv.setUint16(28,n.length,true);cv.setUint32(42,offset,true);c.set(n,46);central.push(c);offset+=local.length+data.length;centralSize+=c.length;}const end=new Uint8Array(22),ev=new DataView(end.buffer);ev.setUint32(0,0x06054b50,true);ev.setUint16(8,files.length,true);ev.setUint16(10,files.length,true);ev.setUint32(12,centralSize,true);ev.setUint32(16,offset,true);return new Blob([...parts,...central,end],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});}
function makeXlsx(sheets){const head='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>';const files=[['[Content_Types].xml',head+`<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>${sheets.map((_,i)=>`<Override PartName="/xl/worksheets/sheet${i+1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join('')}</Types>`],['_rels/.rels',head+'<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>'],['xl/workbook.xml',head+`<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>${sheets.map((s,i)=>`<sheet name="${xml(s.name)}" sheetId="${i+1}" r:id="rId${i+1}"/>`).join('')}</sheets></workbook>`],['xl/_rels/workbook.xml.rels',head+`<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">${sheets.map((_,i)=>`<Relationship Id="rId${i+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i+1}.xml"/>`).join('')}<Relationship Id="rId${sheets.length+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>`],['xl/styles.xml',head+'<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><fonts count="2"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="11"/><color rgb="FF245C45"/><name val="Calibri"/></font></fonts><fills count="3"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill><fill><patternFill patternType="solid"><fgColor rgb="FFE5EFDC"/><bgColor indexed="64"/></patternFill></fill></fills><borders count="1"><border/></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="3"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"><alignment vertical="top" wrapText="1"/></xf><xf numFmtId="0" fontId="1" fillId="2" borderId="0" xfId="0"><alignment vertical="top" wrapText="1"/></xf><xf numFmtId="9" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/></cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>']];sheets.forEach((s,i)=>{const width=Math.max(...s.rows.map(r=>r.length));files.push([`xl/worksheets/sheet${i+1}.xml`,head+`<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetViews><sheetView workbookViewId="0"><pane ySplit="2" topLeftCell="A3" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews><cols>${Array.from({length:width},(_,j)=>`<col min="${j+1}" max="${j+1}" width="${j===0?18:j===2?32:24}" customWidth="1"/>`).join('')}</cols><sheetData>${s.rows.map((row,ri)=>`<row r="${ri+1}"${ri===1?' ht="46" customHeight="1"':''}>${row.map((val,ci)=>{const style=ri<2?1:s.percents.includes(ci)&&typeof val==='number'?2:0;return typeof val==='number'?`<c r="${colName(ci)}${ri+1}" s="${style}"><v>${val}</v></c>`:`<c r="${colName(ci)}${ri+1}" s="${style}" t="inlineStr"><is><t xml:space="preserve">${xml(val)}</t></is></c>`;}).join('')}</row>`).join('')}</sheetData><autoFilter ref="A2:${colName(width-1)}${s.rows.length}"/></worksheet>`]);});return zip(files);}
function exportReport(list=cloud.rows){try{download(makeXlsx(reportSheets(list)),`Zeleni_detektivi_${new Date().toISOString().slice(0,10)}.xlsx`);}catch(e){alert('Неуспешен Excel експорт. Изтеглете резервно копие JSON от учителския екран.');}}
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b||b.disabled)return;const act=b.dataset.action;if(act==='home')goHome();else if(act==='launch')launch(b.dataset.mission);else if(act==='replay')launch(b.dataset.mission,true);else if(act==='teacher')openTeacher();else if(act==='teacher-reset')resetTeacherResults();else if(act==='teacher-refresh')refreshTeacher();else if(act==='teacher-logout')logoutTeacher();else if(act==='cloud-retry')syncPending();else if(act==='pending-export')exportReport(pendingCloudRecords());else if(act==='sound'){sound=!sound;b.setAttribute('aria-pressed',String(sound));b.setAttribute('aria-label',sound?'Изключи звук':'Включи звук');b.style.background=sound?'#dbeacb':'';if(sound)beep();}else if(act==='save-page'){if(completed().length){view={name:'save'};render();window.scrollTo(0,0);}}else if(act==='build-bridge')buildBridge(b.dataset.side);else if(act==='submit')submit();else if(act==='next')next();else if(act==='hint'){const a=attempt();if(a&&a.position<2&&!a.draft.locked){a.draft.hintUsed=true;persistSession();render();}}else if(act==='add'||act==='subtract'){const a=attempt(),t=a&&getTask(a);if(a&&t?.model==='build'&&a.position<2&&!a.draft.locked){const before=a.draft.segments;a.draft.segments=Math.max(0,Math.min(10,before+(act==='add'?1:-1)));if(a.draft.segments!==before){visualFrame={attemptId:a.id,taskId:t.id,before,after:a.draft.segments};buildSound();}a.draft.feedback=null;persistSession();render();}}else if(act==='sign'){const a=attempt();if(a&&!a.draft.locked&&(a.position>=2||getTask(a).kind!=='compare'||bridgeReady(getTask(a),a.draft))){a.draft.sign=b.dataset.sign;a.draft.feedback=null;persistSession();render();}}else if(act==='certificate')printCertificate();else if(act==='export'){if(cloud.verified)exportReport(cloud.rows);}else if(act==='single-export'&&view.record)exportReport([view.record]);else if(act==='backup'&&cloud.verified)download(new Blob([JSON.stringify({version:VERSION,exportedAt:now(),records:cloud.rows},null,2)],{type:'application/json'}),'Zeleni_detektivi_rezervno_kopie.json');else if(act==='new-session'){session=freshSession();persistSession();goHome();}});
document.addEventListener('input',e=>{if(e.target.id==='answer'){const a=attempt();if(a&&!a.draft.locked){const t=getTask(a),d=a.draft;d.value=e.target.value;const stale=a.position<2&&t.kind==='compare'&&d.bridges?.[t.convertSide]&&d.bridges[t.convertSide].value!==bridgeNumber(d.value);if(stale){delete d.bridges[t.convertSide];d.sign='';d.feedback=null;}persistSession();if(stale){render();$('answer')?.focus();}}}else if(e.target.id==='filter-code'){filterCode=e.target.value;$('teacher-table').innerHTML=teacherTable()+teacherDetails();}});
document.addEventListener('submit',e=>{if(e.target.id==='answer-form'){e.preventDefault();submit();}else if(e.target.id==='save-form'){e.preventDefault();finish($('student-code').value);}else if(e.target.id==='teacher-login-form'){e.preventDefault();const email=$('teacher-email').value,password=$('teacher-password').value;$('teacher-password').value='';teacherLogin(email,password);}});
window.addEventListener?.('online',()=>{if(pendingCloudRecords().length)syncPending();});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden'&&view.name!=='saved')persistSession();});
render();
if(pendingCloudRecords().length)syncPending();
